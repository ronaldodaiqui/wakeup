name: Build Android app

on:
  push:
    branches: [main, compare]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Exception|expected" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee publish.log) 2>&1
          SHA="$(git rev-parse HEAD)"
          VER="1.${{ github.run_number }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            # Every build gets its own release, so each download link carries its build number.
            TAG="v$VER"; EXTRA="--latest"
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          else
            TAG="${{ github.ref_name }}"; EXTRA="--prerelease"
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          APK="Wakeup-$VER.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "$SHA" $EXTRA \
            --title "Wakeup $VER" \
            --notes "Open this page on your Android phone, tap $APK to download, then open the file to install. Built from ${SHA::7}."

      - name: Report publish errors
        if: failure()
        shell: bash
        run: |
          [ -f publish.log ] && tail -20 publish.log | while IFS= read -r line; do echo "::error::${line}"; done || true
